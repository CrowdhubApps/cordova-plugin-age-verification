name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1, which is newer than the
      # version bundled with Node 24. Upgrade explicitly to be safe.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Validate package
        run: |
          node --check www/AgeVerification.js
          npx -y -p typescript tsc --noEmit --strict types/index.d.ts

      - name: Verify release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag: $TAG (version $TAG_VERSION)"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION). Bump package.json and re-tag."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: authentication is via OIDC (trusted publisher
      # configured on npmjs.com). Provenance is generated automatically.
      - name: Publish
        run: npm publish --access public --provenance

      - name: Summary
        run: echo "Published ${{ github.event.release.tag_name }} to npm via trusted publishing." >> "$GITHUB_STEP_SUMMARY"
